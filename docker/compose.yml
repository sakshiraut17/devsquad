version: '3.8'

services:
  # PostgreSQL Datastore
  postgres:
    image: postgres:16-alpine
    container_name: devsquad-postgres
    restart: always
    environment:
      POSTGRES_USER: devsquad_user
      POSTGRES_PASSWORD: devsquad_password_secure
      POSTGRES_DB: devsquad_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devsquad_user -d devsquad_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend API Server
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    container_name: devsquad-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - DATABASE_URL=postgresql+asyncpg://devsquad_user:devsquad_password_secure@postgres:5432/devsquad_db
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../backend:/app

volumes:
  postgres_data:
